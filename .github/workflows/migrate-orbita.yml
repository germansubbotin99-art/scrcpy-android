name: Migrate ORBITA UI into sources

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Fetch BoringSSL dependency
        run: |
          rm -rf app/src/main/cpp/boringssl
          git clone https://boringssl.googlesource.com/boringssl app/src/main/cpp/boringssl
          cd app/src/main/cpp/boringssl
          git checkout a2f9a2474d0703e6ac3111a07129ead7c5aa8245

      - name: Freeze current ORBITA UI into Kotlin sources
        run: |
          python3 .github/scripts/orbita_patch.py
          ./gradlew brandUiSources injectOrbitaHud

      - name: Remove temporary build-time patching
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          start_marker = '// STITCHLINK v1.2 branding layer.'
          start = text.index(start_marker)
          end = text.index('android {', start)
          text = text[:start] + '''tasks.named("preBuild") {
              dependsOn("copyScrcpyServer")
          }

          ''' + text[end:]
          text = text.replace('versionCode = 3', 'versionCode = 4')
          text = text.replace('versionName = "1.2-stitchlink-orbita"', 'versionName = "1.4.0"')
          gradle.write_text(text, encoding='utf-8')

          main = Path('app/src/main/java/tech/devline/scropy_ui/MainActivity.kt')
          main_text = main.read_text(encoding='utf-8').replace(
              'STITCHLINK • ОРБИТА v1.2',
              'STITCHLINK • ОРБИТА v1.4.0',
          )
          main.write_text(main_text, encoding='utf-8')

          theme = Path('app/src/main/java/tech/devline/scropy_ui/ui/theme/Theme.kt')
          theme_text = theme.read_text(encoding='utf-8')
          compat_marker = '/**\n * Временная совместимость со старым именем темы.'
          if compat_marker in theme_text:
              theme_text = theme_text[:theme_text.index(compat_marker)].rstrip() + '\n'
          theme.write_text(theme_text, encoding='utf-8')

          workflow = Path('.github/workflows/build-apk.yml')
          wf = workflow.read_text(encoding='utf-8')
          patch_step = '''      - name: Apply STITCHLINK ORBITA UI patch
                run: python3 .github/scripts/orbita_patch.py

          '''
          if patch_step not in wf:
              raise RuntimeError('Build-time patch step not found')
          workflow.write_text(wf.replace(patch_step, ''), encoding='utf-8')
          PY

          rm -f .github/scripts/orbita_patch.py
          rm -f .github/workflows/migrate-orbita.yml

      - name: Verify clean source build
        run: ./gradlew assembleDebug

      - name: Commit native ORBITA sources
        run: |
          rm -rf app/src/main/cpp/boringssl
          git diff --check
          git status --short
          git config user.name "STITCHLINK Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "STITCHLINK ORBITA v1.4: migrate UI into native sources"
          git push origin HEAD:main
