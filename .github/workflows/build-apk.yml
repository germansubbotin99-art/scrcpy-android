name: Build Landscape APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply STITCHLINK ORBITA UI patch
        run: python3 .github/scripts/orbita_patch.py

      - name: Apply ORBITA v1.5 stream settings
        run: python3 .github/scripts/orbita_v15_stream_settings.py

      - name: Apply ORBITA v1.5.1 operator profiles
        run: python3 .github/scripts/orbita_v151_profiles.py

      - name: Fetch BoringSSL dependency
        run: |
          rm -rf app/src/main/cpp/boringssl
          git clone https://boringssl.googlesource.com/boringssl app/src/main/cpp/boringssl
          cd app/src/main/cpp/boringssl
          git checkout a2f9a2474d0703e6ac3111a07129ead7c5aa8245

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STITCHLINK-ORBITA-v1.5.1-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
